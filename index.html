<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Slepá mapa ČR - Kvíz</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #fff; text-align: center; }
    #header { padding: 12px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; }
    #map { height: calc(100vh - 120px); width: 100vw; background: #020617; }
    #footer { padding: 10px; background: #1e293b; display: flex; justify-content: center; gap: 15px; align-items: center; }
    
    .btn { background: #2563eb; color: white; border: none; padding: 10px 20px; font-size: 1rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn:disabled { background: #64748b; cursor: not-allowed; }
    .btn-success { background: #16a34a; }
    
    #timer { font-size: 1.3rem; font-weight: bold; color: #f59e0b; width: 50px; }
    .black-dot { background-color: #000; border: 2px solid #fff; border-radius: 50%; }
  </style>
</head>
<body>

  <div id="header">
    <div style="font-size: 1.2rem;">Hledáme: <strong id="target-name" style="color: #38bdf8;">Načítám...</strong></div>
    <div id="timer">30s</div>
    <div>Skóre: <span id="score">0</span></div>
  </div>

  <div id="map"></div>

  <div id="footer">
    <button id="done-btn" class="btn btn-success" onclick="confirmGuess()" disabled>HOTOVO</button>
    <button id="next-btn" class="btn" onclick="nextQuestion()" disabled>Další místo ➔</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const TOLERANCE_KM = 50;
    
    let LOCATIONS = []; // Místa se načtou dynamicky z JSONu
    let currentTarget = null;
    let score = 0;
    let timeLeft = 30;
    let timerInterval = null;
    let isLocked = false;
    let lastClickPos = null;

    let userCircle = null;
    let targetDot = null;

    // 1. Inicializace mapy
    const map = L.map('map', {
      zoomControl: false, dragging: false, touchZoom: false, doubleClickZoom: false, scrollWheelZoom: false
    }).setView([49.8175, 15.4730], 7.5);

    // 2. Načtení obrysu ČR (GeoJSON)
    fetch('https://raw.githubusercontent.com/mledoze/countries/master/data/cze.geo.json')
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          style: { color: '#94a3b8', weight: 2, fillColor: '#1e293b', fillOpacity: 0.9 }
        }).addTo(map);
      });

    // 3. Načtení herních míst ze souboru locations.json
    fetch('locations.json')
      .then(response => {
        if (!response.ok) {
          throw new Error("Soubor locations.json se nepodařilo načíst.");
        }
        return response.json();
      })
      .then(data => {
        LOCATIONS = data;
        nextQuestion(); // Odstartuje hru až po úspěšném načtení dat
      })
      .catch(error => {
        console.error("Chyba při načítání lokací:", error);
        document.getElementById('target-name').innerText = "Chyba načítání dat";
      });

    // 4. Logika výběru otázky
    function nextQuestion() {
      if (LOCATIONS.length === 0) return;

      if (userCircle) map.removeLayer(userCircle);
      if (targetDot) map.removeLayer(targetDot);
      
      isLocked = false;
      lastClickPos = null;
      document.getElementById('done-btn').disabled = true;
      document.getElementById('next-btn').disabled = true;

      const randomIndex = Math.floor(Math.random() * LOCATIONS.length);
      currentTarget = LOCATIONS[randomIndex];
      document.getElementById('target-name').innerText = currentTarget.name;

      // Start odpočtu
      clearInterval(timerInterval);
      timeLeft = 30;
      document.getElementById('timer').innerText = `${timeLeft}s`;
      
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = `${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          confirmGuess();
        }
      }, 1000);
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // Dotyk na mapu
    map.on('click', function(e) {
      if (isLocked) return;

      lastClickPos = e.latlng;
      document.getElementById('done-btn').disabled = false;

      if (userCircle) map.removeLayer(userCircle);

      userCircle = L.circle([lastClickPos.lat, lastClickPos.lng], {
        radius: TOLERANCE_KM * 1000,
        color: '#f97316',
        fillColor: '#f97316',
        fillOpacity: 0.4,
        weight: 3
      }).addTo(map);
    });

    // Potvrzení a vyhodnocení
    function confirmGuess() {
      if (isLocked) return;
      isLocked = true;
      clearInterval(timerInterval);
      document.getElementById('done-btn').disabled = true;
      document.getElementById('next-btn').disabled = false;

      if (!lastClickPos) {
        alert("Nevložil(a) jsi žádný tip!");
        return;
      }

      const dist = getDistanceKm(lastClickPos.lat, lastClickPos.lng, currentTarget.lat, currentTarget.lon);
      const isHit = dist <= TOLERANCE_KM;

      if (isHit) {
        score++;
        document.getElementById('score').innerText = score;
      }

      targetDot = L.circleMarker([currentTarget.lat, currentTarget.lon], {
        className: 'black-dot', radius: 8, color: '#fff', weight: 2, fillColor: '#000', fillOpacity: 1
      }).addTo(map);

      const finalColor = isHit ? '#22c55e' : '#ef4444';
      userCircle.setStyle({ color: finalColor, fillColor: finalColor });
      
      targetDot.bindPopup(`<b>${currentTarget.name}</b><br>Odchylka: ${dist.toFixed(1)} km`).openPopup();
    }
  </script>
</body>
</html>
