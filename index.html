<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Slepá mapa ČR</title>

  <!-- CSS Knihovny -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column vh-100 overflow-hidden bg-light">

  <!-- Navigace -->
  <header class="navbar navbar-dark bg-dark px-3 shadow-sm d-flex justify-content-between align-items-center">
    <span class="navbar-brand mb-0 h1 fs-4 fw-bold">Slepá mapa ČR</span>
    
    <!-- Volba vrstev (Rozbalovací nabídka s checkboxy) -->
    <div class="dropdown">
      <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" id="mapLayersDropdown" data-bs-toggle="dropdown" aria-expanded="false">
        🗺️ Vrstvy mapy
      </button>
      <ul class="dropdown-menu dropdown-menu-end p-2 shadow" aria-labelledby="mapLayersDropdown">
        <li>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="check-kraje">
            <label class="form-check-label text-dark fw-medium" for="check-kraje">
              Hranice a popisky
            </label>
          </div>
        </li>
        <li>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="check-reky">
            <label class="form-check-label text-dark fw-medium" for="check-reky">
              Vodní toky
            </label>
          </div>
        </li>
      </ul>
    </div>

    <!-- Skóre a Čas -->
    <div class="d-flex gap-2">
      <div class="badge bg-secondary fs-6 px-3 py-2">Skóre: <span id="score" class="text-warning">0</span></div>
      <div class="badge bg-secondary fs-6 px-3 py-2">Čas: <span id="timer" class="text-info">30</span>s</div>
    </div>
  </header>

  <!-- Target Banner -->
  <div id="target-container" class="bg-secondary text-white text-center py-2 px-3 shadow-sm">
    <span class="fs-5 fw-medium">Najdi na mapě: </span>
    <span id="target-name" class="fs-4 fw-bold text-warning d-inline-block ms-1">Načítám data...</span>
  </div>

  <!-- Mapa -->
  <div id="map" class="flex-grow-1"></div>

  <!-- Modal -->
  <div id="overlay" class="position-fixed top-0 start-0 w-100 h-100 justify-content-center align-items-center">
    <div class="card shadow-lg p-4 text-center border-0 modal-card">
      <h2 id="modal-title" class="h3 fw-bold mb-3 text-dark">Vyhodnocení</h2>
      <p id="modal-text" class="fs-5 text-muted mb-4"></p>
      <button class="btn btn-success btn-lg fw-bold py-2 px-4 shadow-sm" onclick="nextRound()">Další otázka</button>
    </div>
  </div>

  <!-- Skripty -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
