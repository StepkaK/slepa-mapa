<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Slepá mapa ČR – Geografické extrémy</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Vlastní CSS styly -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column vh-100 overflow-hidden bg-light">

  <!-- Horní lišta (Bootstrap Navbar) -->
  <header class="navbar navbar-dark bg-dark px-3 shadow-sm">
    <span class="navbar-brand mb-0 h1 fs-4 fw-bold">Slepá mapa ČR</span>
    <div class="d-flex gap-2">
      <div class="badge bg-secondary fs-6 px-3 py-2">Skóre: <span id="score" class="text-warning">0</span></div>
      <div class="badge bg-secondary fs-6 px-3 py-2">Čas: <span id="timer" class="text-info">30</span>s</div>
    </div>
  </header>

  <!-- Poutač s hledaným cílem -->
  <div id="target-container" class="bg-secondary text-white text-center py-2 px-3 shadow-sm">
    <span class="fs-5 fw-medium">Najdi na mapě: </span>
    <span id="target-name" class="fs-4 fw-bold text-warning d-inline-block ms-1">Načítám data...</span>
  </div>

  <!-- Container s mapou -->
  <div id="map" class="flex-grow-1"></div>

  <!-- Vyskakovací okno po vyhodnocení (Bootstrap Modal simulace / Overlay) -->
  <div id="overlay" class="position-fixed top-0 start-0 w-100 h-100 justify-content-center align-items-center">
    <div class="card shadow-lg p-4 text-center border-0 modal-card">
      <h2 id="modal-title" class="h3 fw-bold mb-3 text-dark">Vyhodnocení</h2>
      <p id="modal-text" class="fs-5 text-muted mb-4"></p>
      <button class="btn btn-success btn-lg fw-bold py-2 px-4 shadow-sm" onclick="nextRound()">Další otázka</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Herní skript -->
  <script>
    // --- KONFIGURACE A PROMĚNNÉ ---
    const MAX_DISTANCE_KM = 30; // Tolerance vzdálenosti
    const TIME_LIMIT = 30;

    let locations = [];
    let currentLocationIndex = 0;
    let score = 0;
    let timer = TIME_LIMIT;
    let timerInterval = null;
    let map = null;
    let userMarker = null;
    let targetMarker = null;
    let polyline = null;
    let isAnswered = false;

    // --- INICIALIZACE MAPY ---
    function initMap() {
      map = L.map('map', {
        zoomControl: true,
        doubleClickZoom: false
      }).setView([49.8175, 15.4730], 8);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        maxZoom: 19,
        minZoom: 7
      }).addTo(map);

      map.on('click', onMapClick);
    }

    // --- NAČTENÍ DATA Z JSON SOUBORU ---
    function loadData() {
      fetch('zajimavosti.json')
        .then(response => {
          if (!response.ok) {
            throw new Error('Nelze načíst soubor zajimavosti.json');
          }
          return response.json();
        })
        .then(data => {
          locations = data.sort(() => 0.5 - Math.random());
          if (locations.length > 0) {
            startGame();
          } else {
            document.getElementById('target-name').innerText = 'Soubor JSON je prázdný!';
          }
        })
        .catch(error => {
          console.error(error);
          document.getElementById('target-name').innerText = 'Chyba při načítání dat!';
        });
    }

    // --- HERNÍ LOGIKA ---
    function startGame() {
      currentLocationIndex = 0;
      score = 0;
      document.getElementById('score').innerText = score;
      setupRound();
    }

    function setupRound() {
      isAnswered = false;
      clearMapLayers();
      
      const currentTarget = locations[currentLocationIndex];
      document.getElementById('target-name').innerText = currentTarget.name;

      timer = TIME_LIMIT;
      document.getElementById('timer').innerText = timer;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timer--;
        document.getElementById('timer').innerText = timer;
        if (timer <= 0) {
          clearInterval(timerInterval);
          handleTimeout();
        }
      }, 1000);
    }

    function onMapClick(e) {
      if (isAnswered || locations.length === 0) return;
      isAnswered = true;
      clearInterval(timerInterval);

      const userLat = e.latlng.lat;
      const userLng = e.latlng.lng;
      const target = locations[currentLocationIndex];

      const targetLatLng = L.latLng(target.lat, target.lon);
      const userLatLng = L.latLng(userLat, userLng);
      const distanceMeters = userLatLng.distanceTo(targetLatLng);
      const distanceKm = Math.round(distanceMeters / 1000);

      const isSuccess = distanceKm <= MAX_DISTANCE_KM;
      const markerColor = isSuccess ? '#198754' : '#dc3545';

      userMarker = L.circleMarker([userLat, userLng], {
        radius: 9,
        fillColor: markerColor,
        color: '#ffffff',
        weight: 2,
        fillOpacity: 0.9
      }).addTo(map);

      targetMarker = L.circleMarker([target.lat, target.lon], {
        radius: 7,
        fillColor: '#212529',
        color: '#ffffff',
        weight: 2,
        fillOpacity: 1
      }).addTo(map);

      polyline = L.polyline([[userLat, userLng], [target.lat, target.lon]], {
        color: markerColor,
        weight: 4,
        dashArray: '6, 8'
      }).addTo(map);

      if (isSuccess) {
        score++;
        document.getElementById('score').innerText = score;
      }

      showModal(
        isSuccess ? 'Skvělý tip!' : 'Mimo toleranci',
        `Chyba: <strong>${distanceKm} km</strong>.<br>Tolerance pro zisk bodu je ${MAX_DISTANCE_KM} km.`
      );
    }

    function handleTimeout() {
      if (isAnswered) return;
      isAnswered = true;

      const target = locations[currentLocationIndex];
      
      targetMarker = L.circleMarker([target.lat, target.lon], {
        radius: 9,
        fillColor: '#dc3545',
        color: '#ffffff',
        weight: 2,
        fillOpacity: 1
      }).addTo(map);

      showModal('Čas vypršel!', `Správná poloha byla zobrazena na mapě.`);
    }

    function showModal(title, text) {
      setTimeout(() => {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-text').innerHTML = text;
        document.getElementById('overlay').style.display = 'flex';
      }, 500);
    }

    function nextRound() {
      document.getElementById('overlay').style.display = 'none';
      currentLocationIndex++;

      if (currentLocationIndex < locations.length) {
        setupRound();
      } else {
        alert(`Konec hry! Tvoje celkové skóre je ${score} z ${locations.length} bodů.`);
        startGame();
      }
    }

    function clearMapLayers() {
      if (userMarker) map.removeLayer(userMarker);
      if (targetMarker) map.removeLayer(targetMarker);
      if (polyline) map.removeLayer(polyline);
    }

    window.onload = () => {
      initMap();
      loadData();
    };
  </script>
</body>
</html>
